<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/icon.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>圆焰之庭</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        * {
            &::-webkit-scrollbar {
                height: 5px;
                display: block;
                width: 5px;
            }


            &::-webkit-scrollbar-track {
                background: rgba(255, 245, 247, 0.3);
                border-radius: 10px;
            }

            &::-webkit-scrollbar-thumb {
                background: linear-gradient(90deg, #ffdae2, #ffb7c5, #ffdae2);
                border-radius: 10px;
                box-shadow:
                        0 0 6px 1px rgba(255, 183, 197, 0.8),
                        inset 0 0 4px rgba(255, 255, 255, 0.9);
            }

            &::-webkit-scrollbar-button {
                display: none;
                width: 0;
                height: 0;
            }
        }

        @media screen and (max-width: 768px) {
            #madoka {
                position: relative;
            }

            #madoka::before {
                content: "本网站仅支持PC端访问";
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #fff;
                color: #333;
                font-size: 14px;
                z-index: 9999;
            }
        }

    </style>
</head>
<body>
<div id="madoka"></div>
<script type="module" src="/src/main.ts"></script>
<script src="http://cdn.rain.madokami.cn/js/live2d/live2dcubismcore.min.js"></script>
<script src="http://cdn.rain.madokami.cn/js/live2d/live2d.min.js"></script>

</body>
</html>
